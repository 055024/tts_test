# Nginx site config for TTS Remote Controller
# Frontend: served by Nginx on port 3100
# Backend API: Python FastAPI app listening on 127.0.0.1:8001

server {
    listen 3100;
    server_name _;

    # Serve the static frontend (index.html) from the repo root
    root /home/ashok/Desktop/tts_test;
    index index.html;

    # Optional: gzip for faster delivery
    gzip on;
    gzip_types text/plain application/javascript application/json text/css text/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Cache headers for static assets (adjust if you add hashed assets)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|mp3|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend app on 127.0.0.1:8001
    location /api/ {
        proxy_pass http://127.0.0.1:8001;

        # Preserve client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (tune for long requests if needed)
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket headers (harmless if unused)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
server {
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/audiodub.peop360.com/fullchain.pem; #>
    ssl_certificate_key /etc/letsencrypt/live/audiodub.peop360.com/privkey.pem; #>
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # All other settings from the http block should be duplicated here
    # For example:
    server_name audiodub.peop360.com;

    root /home/ashok/Desktop/tts_test;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}